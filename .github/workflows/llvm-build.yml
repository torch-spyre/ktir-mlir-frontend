name: LLVM Build

on:
  # DEPRECATED (issue #24): refreshes the legacy Actions artifact within the
  # 90-day retention window. Kept live during Stage 1 migration while the
  # artifact remains a fallback to the release asset; remove once the release
  # path is confirmed and consumers have cut over.
  schedule:
    - cron: '0 2 1 */2 *'   # 1st of every other month
  push:
    branches: [main]
    paths:
      - cmake/llvm-hash.txt
  pull_request:
    paths:
      - .github/workflows/llvm-build.yml
  workflow_dispatch:
    inputs:
      llvm-hash:
        description: "Full 40-character LLVM commit SHA to build (overrides cmake/llvm-hash.txt)"
        required: false
        type: string

# Release create/upload/delete (publishing the LLVM build as a release asset).
permissions:
  contents: write

env:
  SCCACHE_DIR: ${{ github.workspace }}/sccache

jobs:

  # Read the pinned LLVM commit once so all downstream jobs share the same value.
  get-hash:
    runs-on: ubuntu-22.04
    outputs:
      llvm-hash:       ${{ steps.read.outputs.llvm-hash }}
      llvm-short-hash: ${{ steps.read.outputs.llvm-short-hash }}
      release-tag:     ${{ steps.read.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Read LLVM commit hash
        id: read
        run: |
          # workflow_dispatch input takes precedence over the pinned file.
          LLVM_HASH="${{ inputs.llvm-hash }}"
          if [ -z "$LLVM_HASH" ]; then
            LLVM_HASH=$(cat cmake/llvm-hash.txt 2>/dev/null || echo "")
          fi
          # An empty hash is always a bug here (this workflow only ever builds a
          # custom LLVM — it never uses mlir_wheel): the pin file is missing or a
          # trigger is misconfigured. Fail loud rather than green-skip downstream.
          if [ -z "$LLVM_HASH" ]; then
            echo "::error::No LLVM hash resolved — cmake/llvm-hash.txt is missing/empty and no llvm-hash input was given."
            exit 1
          fi
          SHORT="${LLVM_HASH:0:8}"
          echo "llvm-hash=$LLVM_HASH"       >> $GITHUB_OUTPUT
          echo "llvm-short-hash=$SHORT"     >> $GITHUB_OUTPUT
          echo "release-tag=llvm-$SHORT"    >> $GITHUB_OUTPUT

  # Create the shared llvm-<short> prerelease once, before the build matrix
  # fans out.  Each build job then just uploads its own platform asset to this
  # existing release — no create race across the 3 parallel jobs.
  # Skipped on PRs (which build + package to validate the workflow only).
  create-release:
    needs: get-hash
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.get-hash.outputs.release-tag }}"
          SHORT="${{ needs.get-hash.outputs.llvm-short-hash }}"
          # Idempotent: a re-run (or a hash whose release already exists) is a no-op.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --target main \
                 --title "LLVM $SHORT" \
                 --notes "Prebuilt LLVM/MLIR for ktir pin $SHORT (build-input cache, not a software release)."

  build:
    name: Build LLVM (${{ matrix.config.runner }})
    needs: [get-hash, create-release]
    # create-release is skipped on PRs; build must still run there (build +
    # package validates the workflow). !cancelled() lets it run through that
    # skip, so it also defeats the implicit success() gate on get-hash —
    # require get-hash success explicitly, and that create-release didn't fail.
    if: ${{ !cancelled() && needs.get-hash.result == 'success' && needs.create-release.result != 'failure' }}
    runs-on: ${{ matrix.config.runs-on }}

    strategy:
      fail-fast: true
      matrix:
        config:
          - { runner: "Ubuntu 22.04 x64",   runs-on: "ubuntu-22.04",     os: "ubuntu", arch: "x64",   linker: "lld" }
          - { runner: "macOS 15 ARM64",      runs-on: "macos-15",         os: "macos",  arch: "arm64", linker: ""    }
          - { runner: "Ubuntu 22.04 ARM64",  runs-on: "ubuntu-22.04-arm", os: "ubuntu", arch: "arm64", linker: "lld" }

    steps:
      - uses: actions/checkout@v4

      # Two independent existence checks, kept in separate steps so each path's
      # logic stays self-contained.  The build/package steps run if EITHER target
      # is missing (no point building when both already exist); each upload then
      # fires only when its own target is absent.  gh needs a repo context, hence
      # the checkout above.
      - name: Check existing release asset
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT="${{ needs.get-hash.outputs.llvm-short-hash }}"
          TAG="${{ needs.get-hash.outputs.release-tag }}"
          ARTIFACT_NAME="llvm-${SHORT}-${{ matrix.config.os }}-${{ matrix.config.arch }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          if gh release view "$TAG" --json assets \
               -q '.assets[].name' 2>/dev/null | grep -qx "${ARTIFACT_NAME}.tar.gz"; then
            echo "release-exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Release asset ${ARTIFACT_NAME}.tar.gz already exists"
          else
            echo "release-exists=false" >> $GITHUB_OUTPUT
          fi

      # DEPRECATED (issue #24): legacy Actions-artifact existence check.
      - name: Check existing artifact (legacy)
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="${{ steps.release.outputs.artifact-name }}"
          if [ -n "$(gh api \
               "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
               -q '.artifacts[0].id // empty' 2>/dev/null)" ]; then
            echo "artifact-exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Legacy artifact ${ARTIFACT_NAME} already exists"
          else
            echo "artifact-exists=false" >> $GITHUB_OUTPUT
          fi

      # Combined flag: both targets present → nothing to build.  The build steps
      # gate on this; each upload still gates on its own flag above.
      - name: Determine whether a build is needed
        id: check
        run: |
          if [ "${{ steps.release.outputs.release-exists }}" = "true" ] \
             && [ "${{ steps.artifact.outputs.artifact-exists }}" = "true" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Both release asset and artifact exist; skipping build"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set artifact name
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: echo "LLVM_INSTALL_DIR=${{ steps.release.outputs.artifact-name }}" >> $GITHUB_ENV

      - name: Checkout LLVM
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          path: llvm-project
          ref: ${{ needs.get-hash.outputs.llvm-hash }}

      # Detect whether this commit is a stable release tag (llvmorg-*).
      # git ls-remote checks the remote directly — no checkout or fetch-tags needed.
      # Stable builds skip check-mlir and assertions; any regressions in ktir
      # itself will surface in cmake-py-test.
      - name: Detect stable build
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: |
          LLVM_HASH="${{ needs.get-hash.outputs.llvm-hash }}"
          if git ls-remote https://github.com/llvm/llvm-project 'refs/tags/llvmorg-*^{}' \
               | grep -q "^${LLVM_HASH}"; then
            echo "IS_STABLE_BUILD=true"  >> $GITHUB_ENV
          else
            echo "IS_STABLE_BUILD=false" >> $GITHUB_ENV
          fi

      - name: Install uv
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        uses: astral-sh/setup-uv@v5

      - name: Install prerequisites
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: |
          # numpy<2 is only needed for check-mlir's Python tests; stable builds skip it
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            uv sync --group llvm-build --no-install-project
          else
            uv sync --group llvm-build-nightly --no-install-project
          fi
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Enable sccache
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key:          ${{ matrix.config.os }}-${{ matrix.config.arch }}-${{ needs.get-hash.outputs.llvm-short-hash }}
          restore-keys: ${{ matrix.config.os }}-${{ matrix.config.arch }}-
          save-always: true

      # MLIR_ENABLE_BINDINGS_PYTHON=ON exports MLIRPythonSources.Core and related
      # cmake targets into the install tree. These are required by downstream
      # consumers (cmake-py-test) to build the ktir Python wheel via scikit-build-core.
      - name: Configure LLVM
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: |
          CMAKE_ARGS=(
            -GNinja -B llvm-project/build
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_C_COMPILER=clang
            -DCMAKE_CXX_COMPILER=clang++
            -DCMAKE_C_COMPILER_LAUNCHER=sccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
            -DCMAKE_INSTALL_PREFIX="${{ env.LLVM_INSTALL_DIR }}"
            -DLLVM_ENABLE_PROJECTS="mlir"
            -DLLVM_TARGETS_TO_BUILD="host"
            -DLLVM_BUILD_UTILS=ON
            -DLLVM_INSTALL_UTILS=ON
            -DLLVM_ENABLE_ZSTD=OFF
            -DLLVM_ENABLE_TERMINFO=OFF
            -DLLVM_ENABLE_LIBXML2=OFF
            -DMLIR_ENABLE_BINDINGS_PYTHON=ON
            # Use uv-managed Python so MLIRDetectPythonEnv finds nanobind on all platforms
            -DPython3_EXECUTABLE="$(uv python find)"
          )
          # lld is 2-4x faster than GNU ld for linking; leave empty on macOS (ld64 is fast on ARM64)
          [ -n "${{ matrix.config.linker }}" ] && CMAKE_ARGS+=( -DLLVM_USE_LINKER="${{ matrix.config.linker }}" )
          # Assertions enabled for all builds: active in MLIR code regardless of
          # whether the LLVM hash is a stable tag or a nightly.
          CMAKE_ARGS+=( -DLLVM_ENABLE_ASSERTIONS=ON )
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            CMAKE_ARGS+=(
              -DLLVM_INCLUDE_TESTS=OFF
              -DLLVM_INCLUDE_EXAMPLES=OFF
              -DLLVM_INCLUDE_BENCHMARKS=OFF
            )
          fi
          cmake "${CMAKE_ARGS[@]}" llvm-project/llvm

      - name: Build and install LLVM
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: |
          if [ "$IS_STABLE_BUILD" = "true" ]; then
            ninja -C llvm-project/build install
          else
            ninja -C llvm-project/build check-mlir install
          fi

      - name: Package
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: tar czf "${{ env.LLVM_INSTALL_DIR }}.tar.gz" "${{ env.LLVM_INSTALL_DIR }}"

      # Upload the tarball to the llvm-<short> prerelease that the create-release
      # job already made — each matrix job uploads its own platform asset, so no
      # create race.  PRs skip this (create-release didn't run; build + package
      # validates the workflow only).  --clobber keeps re-runs idempotent.
      - name: Publish release asset
        if: ${{ steps.release.outputs.release-exists != 'true' && github.event_name != 'pull_request' && success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.get-hash.outputs.release-tag }}" \
            "${{ env.LLVM_INSTALL_DIR }}.tar.gz" --clobber

      # DEPRECATED (issue #24): kept alongside the release upload during Stage 1
      # migration so there is always a working MLIR source.  Delete once the
      # release path is confirmed and consumers have cut over to it.
      - name: Upload artifact (legacy)
        if: ${{ steps.artifact.outputs.artifact-exists != 'true' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LLVM_INSTALL_DIR }}
          path: ${{ env.LLVM_INSTALL_DIR }}.tar.gz
          retention-days: 90

      - name: Dump sccache statistics
        if: ${{ steps.check.outputs.exists != 'true' && success() }}
        run: sccache --show-stats

  # Trigger CI against the freshly built LLVM artifact.  Skipped on PRs: the
  # skipped create-release upstream propagates through build's needs chain, so
  # this job's default success() gate skips it — ci.yml already runs on the PR
  # independently, so re-triggering here would duplicate.
  trigger-ci:
    needs: [get-hash, build]
    uses: ./.github/workflows/ci.yml
    with:
      mlir-source:     custom
      llvm-short-hash: ${{ needs.get-hash.outputs.llvm-short-hash }}
      artifact-repo:   ${{ github.repository }}

  # DEPRECATED (issue #24): refreshes the legacy Actions artifact on a schedule
  # to reset the 90-day retention clock while it remains a fallback to the
  # release asset.  Downloads the existing artifact zip and re-uploads it — a
  # full rebuild is unnecessary since the content is identical.  trigger-ci is
  # NOT called after a refresh (artifact content unchanged).  Remove once the
  # release path is confirmed and consumers have cut over.
  #
  # Release assets never expire, so there is no equivalent refresh for them;
  # bound release storage by manually deleting stale tags:
  #   gh release delete <tag> --cleanup-tag --yes
  refresh:
    name: Refresh artifact (${{ matrix.config.runner }})
    needs: get-hash
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ${{ matrix.config.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { runner: "Ubuntu 22.04 x64",   runs-on: "ubuntu-22.04",     os: "ubuntu", arch: "x64"   }
          - { runner: "macOS 15 ARM64",      runs-on: "macos-15",         os: "macos",  arch: "arm64" }
          - { runner: "Ubuntu 22.04 ARM64",  runs-on: "ubuntu-22.04-arm", os: "ubuntu", arch: "arm64" }

    steps:
      - name: Check existing artifact
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARTIFACT_NAME="llvm-${{ needs.get-hash.outputs.llvm-short-hash }}-${{ matrix.config.os }}-${{ matrix.config.arch }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT
          ARTIFACT_ID=$(curl -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=1" \
            | jq -r '.artifacts[0].id // empty')
          if [ -n "$ARTIFACT_ID" ]; then
            echo "artifact-id=${ARTIFACT_ID}" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::warning::Artifact ${ARTIFACT_NAME} not found; cannot refresh — a rebuild may be needed"
          fi

      - name: Download artifact zip
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -sf \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.check.outputs.artifact-id }}/zip" \
            -o artifact.zip
          unzip artifact.zip

      - name: Re-upload artifact (reset 90-day clock)
        if: steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact-name }}
          path: ${{ steps.release.outputs.artifact-name }}.tar.gz
          retention-days: 90

      - name: Delete old artifact
        if: steps.check.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sf -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.check.outputs.artifact-id }}"
