[build-system]
# cmake>=4.0 is required: CMake 3.x writes the full target name into the
# file-API reply filename, and MLIR's mlir_generate_type_stubs() builds a
# 283-char target name by joining DEPENDS_TARGETS. That overflows NAME_MAX
# (255), so scikit-build-core fails with ENAMETOOLONG while reading the
# reply. CMake 4.0.0 truncates the name and relies on the trailing hash.
#
# nanobind<3 is a constraint of the MLIR we pin, not a preference of ours. The
# bindings are built against the LLVM named in cmake/llvm-hash.txt, and that
# tree's MLIRDetectPythonEnv.cmake does `find_package(nanobind 2.9 CONFIG
# REQUIRED)`. CMake reads a bare version as same-major, so nanobind 3.x is
# rejected outright and the build fails at configure time. The upper bound moves
# when the LLVM pin moves to an MLIR that asks for 3.x -- not before.
requires = ["scikit-build-core", "nanobind>=2.12.0,<3", "cmake>=4.0", "ninja>=1.11"]
build-backend = "scikit_build_core.build"

[project]
name = "ktir-mlir-frontend"
version = "0.1.0"
requires-python = ">=3.12,<3.15"  # <3.15: PyFrozenDict_Type breaks the macOS MLIR bindings link (nanobind symbol list)
dependencies = [
    "nanobind>=2.12.0",
]

[project.scripts]
ktdp-walk = "mlir_ktdp.tools.__main__:main"

[project.optional-dependencies]
test = ["lit"]

[tool.scikit-build]
cmake.build-type = "Release"
cmake.args = ["-GNinja"]
install.components = ["KTIRPythonModules"]
# mlir_ktdp/ is fully cmake-managed (extensions + MLIR-generated Python),
# including the tools/ subpackage which was previously a separate package.
wheel.packages = ["python/mlir_ktdp"]

[tool.scikit-build.cmake.define]
KTIR_ENABLE_PYTHON_BINDINGS = "ON"
MLIR_BINDINGS_PYTHON_INSTALL_PREFIX = "mlir_ktdp"
MLIR_PYTHON_STUBGEN_ENABLED = "ON"

[dependency-groups]
# Base build tools for all LLVM builds (stable and nightly).
llvm-build = ["cmake>=4.0", "ninja>=1.11", "sccache>=0.8"]
# numpy<2 is additionally required by check-mlir's Python test suite (nightly only).
# numpy 2.x causes a dense-element ABI mismatch with MLIR at this LLVM version.
# Stable builds skip check-mlir, so they use llvm-build directly.
llvm-build-nightly = [{include-group = "llvm-build"}, "numpy<2"]

[tool.uv]
find-links = ["https://llvm.github.io/eudsl"]
